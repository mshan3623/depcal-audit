name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 패키지 설치 (editable + 테스트/웹 extras)
        # requirements.txt가 아닌 패키지 설치로 돌린다 — pyproject.toml·패키지 경계가
        # 실제로 성립하는지(bare import 잔재가 없는지)를 CI가 매 실행 검증한다.
        run: pip install -e ".[test,web]"

      - name: 패키지 경계 검증 (PYTHONPATH·cwd 비의존 import)
        # 저장소 밖 디렉터리에서 실행 — sys.path 조작에 기대는 import가 남아 있으면 실패한다.
        working-directory: ${{ runner.temp }}
        run: python -c "import vcore.straight_line, vcore.declining_balance, core, depverify, asset_schedule_generator"

      - name: pytest
        run: pytest -q

      - name: depverify 스모크 (CLI 엔드투엔드)
        run: python ci/smoke_depverify.py
